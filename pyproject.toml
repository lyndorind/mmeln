[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmeln"
version = "0.1.0"
description = "Laboratory work 5 CI/CD package"
requires-python = ">=3.11"
dependencies = [
    "requests==2.34.2",
    "urllib3==1.26.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]