name: PR Build & Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov allure-pytest httpx
          pip install -e .

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Pytest with coverage
        run: PYTHONPATH=src pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

  docker-build-pr:
    name: Build Docker Image (Temporary PR Tags)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image with temporary tags
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            lyndorind/mmeln:pr-${{ github.event.number }}
            lyndorind/mmeln:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify built image tags
        run: docker images lyndorind/mmeln

  integration-tests:
    name: Integration Tests (PostgreSQL + Newman)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mmeln_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mmeln_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start FastAPI application in background
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mmeln_db
          DB_USER: postgres
          DB_PASSWORD: testpassword
        run: |
          nohup python -m mmeln.app > app.log 2>&1 &
          for i in {1..15}; do
            if curl -s http://localhost:8000/health | grep -q "connected"; then
              echo "API is ready!"
              break
            fi
            sleep 1
          done

      - name: Set up Node.js and Newman
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman and HTML reporter
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman integration tests
        run: |
          mkdir -p reports
          newman run postman/mmeln_collection.json \
            --env-var "base_url=http://localhost:8000" \
            -r cli,htmlextra \
            --reporter-htmlextra-export reports/newman-report.html

      - name: Show application logs on failure
        if: failure()
        run: cat app.log

      - name: Upload Newman HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-integration-report
          path: reports/newman-report.html

  sonarqube:
    name: SonarQube Code Analysis
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  snyk-security:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements.txt
  load-test:
    name: Load Testing (Apache JMeter)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: mmeln_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mmeln_db"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start FastAPI application in background
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: mmeln_db
          DB_USER: postgres
          DB_PASSWORD: testpassword
        run: |
          nohup python -m mmeln.app > app_load.log 2>&1 &
          for i in {1..15}; do
            if curl -s http://localhost:8000/health | grep -q "connected"; then
              echo "API is ready!"
              break
            fi
            sleep 1
          done

      - name: Run Apache JMeter load test
        run: |
          mkdir -p reports
          docker run --rm --network host -v "${{ github.workspace }}":/test justb4/jmeter -n -t /test/jmeter/load_test.jmx -l /test/reports/jmeter-results.jtl -e -o /test/reports/jmeter-html -JTHREADS=20 -JLOOPS=10

      - name: Upload JMeter HTML Dashboard Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-load-test-report
          path: reports/jmeter-html/
