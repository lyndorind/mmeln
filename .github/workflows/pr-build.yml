name: PR Build, Lint & Test

on:
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build ruff pytest pytest-cov allure-pytest
          pip install -e .

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Pytest with Coverage and Allure
        run: |
          pytest --cov=mmeln --cov-report=xml --cov-report=term-missing --alluredir=allure-results

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Build package
        run: |
          python -m build

      - name: Generate SHA-256 checksum
        run: |
          cd dist
          sha256sum * > checksums.sha256

      - name: Upload package and checksum artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-package
          path: dist/