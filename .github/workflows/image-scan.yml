name: Image Scan

on:
  workflow_call:
    inputs:
      tag:
        description: Image tag to scan
        required: true
        type: string
    secrets:
      SNYK_TOKEN:
        required: false

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Scan with Trivy
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: lyndorind/mmeln:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ inputs.tag }}

  grype:
    name: Scan with Grype
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: lyndorind/mmeln:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install and Scan with Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype ${{ env.IMAGE_REF }} -o sarif --file grype-results.sarif

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif
          category: grype-${{ inputs.tag }}

  snyk:
    name: Scan with Snyk
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: lyndorind/mmeln:${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Scan with Snyk
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_REF }}
          args: --file=Dockerfile --severity-threshold=low --sarif-file-output=snyk.sarif

      - name: Fix invalid SARIF severity values
        if: always()
        run: |
          sudo chown "$(id -u):$(id -g)" snyk.sarif
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("snyk.sarif")
          if not path.exists():
              raise SystemExit("ERROR: snyk.sarif not found")

          data = json.loads(path.read_text(encoding="utf-8"))
          fixed = 0

          def is_number(v):
              if isinstance(v, bool) or v is None:
                  return False
              try:
                  float(v)
                  return True
              except (TypeError, ValueError):
                  return False

          def clean(obj):
              global fixed
              if isinstance(obj, dict):
                  if "security-severity" in obj and not is_number(obj["security-severity"]):
                      del obj["security-severity"]
                      fixed += 1
                  for value in list(obj.values()):
                      clean(value)
              elif isinstance(obj, list):
                  for value in obj:
                      clean(value)

          clean(data)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Removed invalid severity values: {fixed}")
          PY

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk.sarif
          category: snyk-${{ inputs.tag }}