name: Manual Container Vulnerability Scan (by Tag)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Тег (версія) Docker-образу для сканування (наприклад, 1.3.0 або latest)'
        required: true
        default: '1.3.0'
        type: string

permissions:
  contents: read
  security-events: write

env:
  IMAGE_REPO: lyndorind/mmeln

jobs:
  scan-selected-tag:
    name: Scan lyndorind/mmeln:${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull specified Docker image tag
        run: docker pull ${{ env.IMAGE_REPO }}:${{ inputs.image_tag }}

      # 1. Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_REPO }}:${{ inputs.image_tag }}
          format: 'sarif'
          output: 'trivy-manual.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-manual.sarif'
          category: 'trivy-manual-${{ inputs.image_tag }}'

      # 2. Grype
      - name: Install and Run Grype vulnerability scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype ${{ env.IMAGE_REPO }}:${{ inputs.image_tag }} -o sarif --file grype-manual.sarif

      - name: Upload Grype scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'grype-manual.sarif'
          category: 'grype-manual-${{ inputs.image_tag }}'

      # 3. Snyk
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk container scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test ${{ env.IMAGE_REPO }}:${{ inputs.image_tag }} --file=Dockerfile --sarif-file-output=snyk-raw.sarif || true
          jq '(.runs[].tool.driver.rules[]?.properties["security-severity"] | select(. == null)) = "0.0"' snyk-raw.sarif > snyk-manual.sarif

      - name: Upload Snyk scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'snyk-manual.sarif'
          category: 'snyk-manual-${{ inputs.image_tag }}'