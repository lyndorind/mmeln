name: Scheduled Container Vulnerability Scan

on:
  schedule:
    # Щоденний запуск о 02:00 UTC
    - cron: '0 2 * * *'
  # Дозволяє також протестувати запуск одразу після злиття без очікування ночі
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: lyndorind/mmeln:latest

jobs:
  scan-latest-image:
    name: Scan latest image (Trivy, Grype, Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest Docker image
        run: docker pull ${{ env.IMAGE_NAME }}

      # 1. Сканування за допомогою Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          ignore-unfixed: false

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-scheduled'

      # 2. Сканування за допомогою Grype
      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v4
        id: grype
        with:
          image: ${{ env.IMAGE_NAME }}
          output-format: sarif
          fail-build: false

      - name: Upload Grype scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: 'grype-scheduled'

      # 3. Сканування за допомогою Snyk
      - name: Run Snyk to check Docker image for vulnerabilities
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ${{ env.IMAGE_NAME }}
          args: --sarif-file-output=snyk-results.sarif

      - name: Upload Snyk scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'snyk-results.sarif'
          category: 'snyk-scheduled'