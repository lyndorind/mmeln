name: Scheduled Container Vulnerability Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: lyndorind/mmeln:latest

jobs:
  scan-latest-image:
    name: Scan latest image (Trivy, Grype, Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest Docker image
        run: docker pull ${{ env.IMAGE_NAME }}

      # 1. Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          ignore-unfixed: false

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-scheduled'

      # 2. Grype
      - name: Install and Run Grype vulnerability scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype ${{ env.IMAGE_NAME }} -o sarif --file grype-results.sarif

      - name: Upload Grype scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'grype-results.sarif'
          category: 'grype-scheduled'

      # 3. Snyk
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk container scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test ${{ env.IMAGE_NAME }} --file=Dockerfile --sarif-file-output=snyk-raw.sarif || true
          jq '(.runs[].tool.driver.rules[]?.properties["security-severity"] | select(. == null)) = "0.0"' snyk-raw.sarif > snyk-results.sarif

      - name: Upload Snyk scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'snyk-results.sarif'
          category: 'snyk-scheduled'