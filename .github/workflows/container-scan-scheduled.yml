name: Scheduled Container Vulnerability Scan

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  IMAGE_NAME: lyndorind/mmeln:latest

jobs:
  scan-latest-image:
    name: Scan latest image (Trivy, Grype, Snyk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest Docker image
        run: docker pull ${{ env.IMAGE_NAME }}

      # 1. Trivy
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          ignore-unfixed: false

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-scheduled'

      # 2. Grype
      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v4
        id: grype
        with:
          image: ${{ env.IMAGE_NAME }}
          output-format: sarif
          fail-build: false

      - name: Upload Grype scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: 'grype-scheduled'

      # 3. Snyk (запускаємо напряму через Snyk CLI для гарантованого збереження SARIF у workspace)
      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Run Snyk container scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container test ${{ env.IMAGE_NAME }} --file=Dockerfile --sarif-file-output=snyk-results.sarif || true

      - name: Upload Snyk scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('snyk-results.sarif') != ''
        with:
          sarif_file: 'snyk-results.sarif'
          category: 'snyk-scheduled'