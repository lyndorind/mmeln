name: 'Create Tag and GitHub Release'
description: 'Creates a git tag and a GitHub Release with attached assets'

inputs:
  version:
    description: 'Release version (e.g. 0.1.0)'
    required: true
  release_notes:
    description: 'Release description extracted from CHANGELOG'
    required: true
  assets_path:
    description: 'Path to files to attach to release'
    required: true
  github_token:
    description: 'GitHub Token for authentication'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create and push Git tag
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        TAG_NAME="v${{ inputs.version }}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
          echo "Tag $TAG_NAME already exists"
        else
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
        fi

    - name: Create GitHub Release with Assets
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        TAG_NAME="v${{ inputs.version }}"
        echo "${{ inputs.release_notes }}" > release_notes.md
        gh release create "$TAG_NAME" ${{ inputs.assets_path }} \
          --title "Release $TAG_NAME" \
          --notes-file release_notes.md