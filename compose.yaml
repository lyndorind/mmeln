services:
  db:
    image: postgres:16-alpine
    container_name: mmeln-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mmeln_db
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mmeln_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: lyndorind/mmeln:compose-local
    container_name: mmeln-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      alloy:
        condition: service_started
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: mmeln_db
      DB_USER: postgres
      DB_PASSWORD_FILE: /run/secrets/db_password
      OTEL_SERVICE_NAME: mmeln-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    secrets:
      - db_password
    ports:
      - "8000:8000"

  alloy:
    image: grafana/alloy:latest
    container_name: mmeln-alloy
    restart: unless-stopped
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy/config.alloy"
    volumes:
      - ./alloy:/etc/alloy:ro
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  postgres_data:
    driver: local